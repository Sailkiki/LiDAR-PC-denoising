[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "r2net-v2"
version = "2.0.0"
description = "R2-Net v2: a clean and reproducible point-cloud denoising implementation for individual crops and vegetation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Bolin Fu" },
  { name = "Mingzhe Sui" },
  { name = "Fei Yang" },
  { name = "Xing Zhang" },
  { name = "Tengfang Deng" },
]
dependencies = [
  "torch>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "PyYAML>=6.0",
  "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["r2net*"]
